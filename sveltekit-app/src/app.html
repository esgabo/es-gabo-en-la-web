<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#333333" />

    <!-- Migrated from Sapper's template.html -->
    <!-- Assuming index.css is a global stylesheet in the static folder -->
    <link rel="stylesheet" href="/index.css" /> 
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <link rel="icon" sizes="16x16" href="/favicon-16x16.png" type="image/png" /> 
    <link rel="icon" sizes="32x32" href="/favicon-32x32.png" type="image/png" />
    <!-- SvelteKit's default favicon, keeping it as well, adjust as needed -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" /> 
    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
    
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="leading-normal tracking-normal">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
